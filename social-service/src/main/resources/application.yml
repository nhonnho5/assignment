server:
  port: 8084

spring:
  application:
    name: social-service
  datasource:
    url: jdbc:h2:mem:social;DB_CLOSE_DELAY=-1
  jpa:
    open-in-view: false
  cloud:
    function:
      definition: presence
    stream:
      kafka:
        binder:
          brokers: localhost:9092
        streams:
          binder:
            brokers: localhost:9092
            applicationId: social-presence
      bindings:
        # FR-09: presence stream (picked up by the Kafka Streams binder because it is a KStream function)
        presence-in-0:
          destination: focus.sessions
