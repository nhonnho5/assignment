server:
  port: 8084

spring:
  application:
    name: social-service
  datasource:
    url: jdbc:h2:mem:social;DB_CLOSE_DELAY=-1
  jpa:
    open-in-view: false
  cloud:
    function:
      definition: focusSessionEvents
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        focusSessionEvents-in-0:
          destination: focus.sessions
          group: social-service
