server:
  port: 8083

spring:
  application:
    name: focus-service
  datasource:
    url: jdbc:h2:mem:focus;DB_CLOSE_DELAY=-1
  jpa:
    open-in-view: false
  cloud:
    function:
      definition: focusProgress;distractionSpikes
    stream:
      kafka:
        binder:
          brokers: localhost:9092
        streams:
          binder:
            brokers: localhost:9092
            # One Kafka Streams application per function, each with its own state and consumer group
            functions:
              focusProgress:
                applicationId: focus-progress
              distractionSpikes:
                applicationId: focus-distraction-spikes
          bindings:
            focusProgress-in-0:
              consumer:
                # FR-10: event time = startedAt on the Sydney timeline
                timestampExtractorBeanName: sydneyDayTimestampExtractor
      # Two binders on the classpath: the StreamBridge outputs are pinned to the regular Kafka binder;
      # KStream functions are picked up by the Kafka Streams binder automatically.
      bindings:
        # FR-05: StreamBridge output
        focusSessions-out-0:
          destination: focus.sessions
          binder: kafka
        # FR-06: StreamBridge output
        focusDistractions-out-0:
          destination: focus.distractions
          binder: kafka
        # FR-10: progress stream
        focusProgress-in-0:
          destination: focus.sessions
        # FR-12: spike stream, focus.distractions → focus.alerts
        distractionSpikes-in-0:
          destination: focus.distractions
        distractionSpikes-out-0:
          destination: focus.alerts
