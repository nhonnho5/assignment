server:
  port: 8082

spring:
  application:
    name: tutor-service
  config:
    # FR-07: LLM_API_KEY (and optional LLM_MODEL) from the repo's .env, whether started from the repo or the module
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:h2:mem:tutor;DB_CLOSE_DELAY=-1
  jpa:
    open-in-view: false
  servlet:
    multipart:
      # FR-02 AC4: room for lecture-slide PDFs; the text limit (50,000 characters) is checked after extraction
      max-file-size: 20MB
      max-request-size: 20MB
  cloud:
    function:
      definition: plannerTopics
    stream:
      kafka:
        binder:
          brokers: localhost:9092
        bindings:
          plannerTopics-in-0:
            consumer:
              # The topic copy lives in in-memory H2, so rebuild it from the first event on every start
              resetOffsets: true
              startOffset: earliest
      bindings:
        # FR-01 AC10: TopicCreated / TopicDeleted from Planner
        plannerTopics-in-0:
          destination: planner.topics
          group: tutor-service
        # FR-02 AC3: StreamBridge output for MaterialAdded
        tutorMaterials-out-0:
          destination: tutor.materials
        # FR-07 AC5: StreamBridge output for UnderstandingRecorded
        tutorUnderstanding-out-0:
          destination: tutor.understanding

# FR-07: Socratic tutor agent (docs/09-conventions.md, LLM). An empty key keeps the service up; tutoring → 503.
llm:
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:gemini-3.5-flash-lite}
