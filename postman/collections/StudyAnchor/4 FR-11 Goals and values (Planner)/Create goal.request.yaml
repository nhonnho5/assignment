$kind: http-request
url: "{{planner}}/goals"
method: POST
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Pass CSCI318 with a distinction",
      "why": "I want to prove to myself that I can finish what I start.",
      "targetDate": "{{targetDate}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      const set = (k, v) => pm.collectionVariables.set(k, v);
      pm.test('status 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) {
        set('goalId', j.id);
      }
    language: text/javascript
order: 1000
