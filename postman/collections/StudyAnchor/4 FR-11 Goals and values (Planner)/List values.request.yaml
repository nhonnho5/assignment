$kind: http-request
url: "{{planner}}/values"
method: GET
headers:
  X-User-Id: "{{alice}}"
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('1 value', () => pm.expect(j).to.have.length(1));
      }
    language: text/javascript
order: 9000
