$kind: http-request
url: "{{planner}}/goals"
method: POST
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Too late",
      "why": "Testing",
      "targetDate": "{{yesterday}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 3000
