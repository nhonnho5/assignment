$kind: http-request
url: "{{planner}}/goals/{{goal2Id}}/achieve"
method: POST
headers:
  X-User-Id: "{{alice}}"
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('achievedAt recorded (AC4)', () => pm.expect(j.achievedAt).to.be.a('string'));
      }
    language: text/javascript
order: 6000
