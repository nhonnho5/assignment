$kind: http-request
url: "{{tutor}}/tutoring-sessions/{{tutoringId}}"
method: GET
headers:
  X-User-Id: "{{alice}}"
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('transcript kept', () => pm.expect(j.transcript.length).to.be.at.least(10));
      }
    language: text/javascript
order: 7000
