$kind: http-request
url: "{{tutor}}/tutoring-sessions"
method: POST
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "topicId": "{{topicId}}",
      "question": "How do I write a recursive method that sums the numbers in a list?"
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      const set = (k, v) => pm.collectionVariables.set(k, v);
      pm.test('status 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) {
        pm.test('active, no attempts yet, a guiding reply (AC2)', () => {
          pm.expect([j.status, j.attempts, j.solutionRevealed]).to.eql(['ACTIVE', 0, false]);
          pm.expect(j.reply).to.be.a('string').and.not.empty;
        });
        console.log('Tutor:', j.reply);
        set('tutoringId', j.sessionId);
      }
    language: text/javascript
order: 1000
