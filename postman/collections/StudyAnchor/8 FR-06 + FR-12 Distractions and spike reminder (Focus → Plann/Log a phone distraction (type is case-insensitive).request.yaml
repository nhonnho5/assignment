$kind: http-request
url: "{{focus}}/sessions/{{session2Id}}/distractions"
method: POST
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "type": "phone",
      "note": "Checked a notification"
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) {
        pm.test('PHONE, not off-policy', () => pm.expect([j.type, j.offPolicy]).to.eql(['PHONE', false]));
      }
    language: text/javascript
order: 1000
