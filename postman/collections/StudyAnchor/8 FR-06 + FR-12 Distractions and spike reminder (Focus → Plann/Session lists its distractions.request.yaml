$kind: http-request
url: "{{focus}}/sessions/{{session2Id}}"
method: GET
headers:
  X-User-Id: "{{alice}}"
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('3 distractions (AC8)', () => pm.expect(j.distractions).to.have.length(3));
      }
    language: text/javascript
order: 5000
