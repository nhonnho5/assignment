$kind: http-request
url: "{{planner}}/reminders/{{reminderId}}/read"
method: POST
headers:
  X-User-Id: "{{alice}}"
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('readAt recorded', () => pm.expect(j.readAt).to.be.a('string'));
      }
    language: text/javascript
order: 7000
