$kind: http-request
url: "{{planner}}/courses/{{courseId}}/deadlines"
method: POST
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Assignment 2",
      "dueAt": "{{dueAt}}",
      "weight": 40,
      "topicIds": [
        "{{topicId}}",
        "{{topic2Id}}"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      const set = (k, v) => pm.collectionVariables.set(k, v);
      pm.test('status 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) {
        pm.test('due time shown back in Sydney time (AC8)', () => pm.expect(j.dueAt).to.eql(pm.collectionVariables.get('dueAt')));
        set('deadlineId', j.id);
      }
    language: text/javascript
order: 6000
