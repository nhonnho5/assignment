$kind: http-request
url: "{{planner}}/courses/{{courseId}}/deadlines"
method: POST
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Quiz 1",
      "dueAt": "{{pastDueAt}}",
      "weight": 10,
      "topicIds": [
        "{{topicId}}"
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test('status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 7000
