$kind: http-request
url: "{{planner}}/courses/{{courseId}}"
method: GET
headers:
  X-User-Id: "{{alice}}"
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('2 topics, 1 deadline', () => {
          pm.expect(j.topics).to.have.length(2);
          pm.expect(j.deadlines).to.have.length(1);
        });
      }
    language: text/javascript
order: 10000
