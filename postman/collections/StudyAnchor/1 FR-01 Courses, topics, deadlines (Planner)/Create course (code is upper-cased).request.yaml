$kind: http-request
url: "{{planner}}/courses"
method: POST
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "csci318",
      "name": "Software Engineering Practices and Principles"
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      const set = (k, v) => pm.collectionVariables.set(k, v);
      pm.test('status 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) {
        pm.test('code upper-cased (AC6)', () => pm.expect(j.code).to.eql('CSCI318'));
        set('courseId', j.id);
      }
    language: text/javascript
order: 1000
