$kind: http-request
url: "{{planner}}/plans/{{nextMonday}}"
method: GET
headers:
  X-User-Id: "{{alice}}"
scripts:
  - type: beforeRequest
    code: |-
      // Wait for Kafka to deliver the event first.
      setTimeout(() => {}, 3000);
    language: text/javascript
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('first block COMPLETED (FR-12 AC3)', () => pm.expect(j.blocks.find(b => b.id === pm.collectionVariables.get('blockId')).status).to.eql('COMPLETED'));
      }
    language: text/javascript
order: 9000
