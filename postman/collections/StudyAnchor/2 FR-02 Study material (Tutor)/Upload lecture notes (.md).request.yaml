$kind: http-request
url: "{{tutor}}/topics/{{topicId}}/materials"
method: POST
headers:
  X-User-Id: "{{alice}}"
body:
  type: formdata
  content:
    - type: file
      key: file
      src: sample-material.md
    - type: text
      key: title
      value: Week 5 lecture notes
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      const set = (k, v) => pm.collectionVariables.set(k, v);
      pm.test('status 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) {
        pm.test('text extracted', () => pm.expect(j.characters).to.be.above(500));
        set('materialId', j.materialId);
      }
    language: text/javascript
order: 1000
