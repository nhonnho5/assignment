$kind: http-request
url: "{{tutor}}/materials/{{materialId}}"
method: GET
headers:
  X-User-Id: "{{alice}}"
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('full text', () => pm.expect(j.content).to.include('base case'));
      }
    language: text/javascript
order: 4000
