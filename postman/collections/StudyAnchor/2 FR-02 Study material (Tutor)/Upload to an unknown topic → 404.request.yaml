$kind: http-request
url: "{{tutor}}/topics/00000000-0000-0000-0000-000000000000/materials"
method: POST
headers:
  X-User-Id: "{{alice}}"
body:
  type: formdata
  content:
    - type: file
      key: file
      src: sample-material.md
scripts:
  - type: afterResponse
    code: pm.test('status 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 2000
