$kind: http-request
url: "{{social}}/friends/studying-now"
method: GET
headers:
  X-User-Id: "{{bob}}"
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('hidden at once (AC5)', () => pm.expect(j.friendsStudying).to.eql([]));
      }
    language: text/javascript
order: 5000
