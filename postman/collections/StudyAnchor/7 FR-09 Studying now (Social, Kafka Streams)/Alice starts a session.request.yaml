$kind: http-request
url: "{{focus}}/sessions"
method: POST
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "topicId": "{{topicId}}",
      "plannedMinutes": 30,
      "allowedSites": [
        "oracle.com"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      const set = (k, v) => pm.collectionVariables.set(k, v);
      pm.test('status 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) {
        set('session2Id', j.id);
      }
    language: text/javascript
order: 1000
