$kind: http-request
url: "{{social}}/friends/studying-now"
method: GET
headers:
  X-User-Id: "{{bob}}"
scripts:
  - type: beforeRequest
    code: |-
      // Wait for Kafka to deliver the event first.
      setTimeout(() => {}, 3000);
    language: text/javascript
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('Alice listed with topic and elapsed time (AC1, AC8)', () => {
          pm.expect(j.friendsStudying).to.have.length(1);
          pm.expect(j.friendsStudying[0].userId).to.eql(pm.collectionVariables.get('alice'));
          pm.expect(j.friendsStudying[0].topicId).to.eql(pm.collectionVariables.get('topicId'));
          pm.expect(j.friendsStudying[0].elapsed).to.match(/^\d+m \d+s$/);
        });
      }
    language: text/javascript
order: 2000
