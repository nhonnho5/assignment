$kind: http-request
url: "{{social}}/sharing"
method: PUT
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sharing": true
    }
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000
