$kind: http-request
url: "{{social}}/rooms/{{roomId}}/studying-now"
method: GET
headers:
  X-User-Id: "{{outsider}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('outsider', pm.collectionVariables.get('alice') + '-outsider');
    language: text/javascript
  - type: afterResponse
    code: pm.test('status 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 8000
