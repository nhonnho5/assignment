$kind: http-request
name: Wednesday 14:00–16:00
url: "{{planner}}/availability/slots"
method: POST
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "day": "WEDNESDAY",
      "start": "14:00",
      "end": "16:00"
    }
scripts:
  - type: afterResponse
    code: pm.test('status 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
