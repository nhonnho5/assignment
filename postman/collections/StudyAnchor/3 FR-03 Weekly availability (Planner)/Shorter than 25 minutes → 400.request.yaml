$kind: http-request
url: "{{planner}}/availability/slots"
method: POST
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "day": "TUESDAY",
      "start": "09:00",
      "end": "09:20"
    }
scripts:
  - type: afterResponse
    code: pm.test('status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
