$kind: http-request
url: "{{planner}}/availability/slots"
method: POST
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "day": "MONDAY",
      "start": "11:00",
      "end": "13:00"
    }
scripts:
  - type: afterResponse
    code: pm.test('status 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 4000
