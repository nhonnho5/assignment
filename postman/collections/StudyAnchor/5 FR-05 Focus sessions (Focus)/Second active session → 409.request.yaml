$kind: http-request
url: "{{focus}}/sessions"
method: POST
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "plannedMinutes": 25,
      "allowedSites": []
    }
scripts:
  - type: afterResponse
    code: pm.test('status 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 3000
