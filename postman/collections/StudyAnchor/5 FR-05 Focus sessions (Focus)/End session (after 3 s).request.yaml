$kind: http-request
url: "{{focus}}/sessions/{{sessionId}}/end"
method: POST
headers:
  X-User-Id: "{{alice}}"
scripts:
  - type: beforeRequest
    code: setTimeout(() => {}, 3000);
    language: text/javascript
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('ended with an actual duration (AC3, AC5)', () => {
          pm.expect(j.status).to.eql('ENDED');
          pm.expect(j.actualDuration).to.match(/^\d+m \d+s$/);
          pm.expect(j.actualSeconds).to.be.at.least(3);
        });
      }
    language: text/javascript
order: 5000
