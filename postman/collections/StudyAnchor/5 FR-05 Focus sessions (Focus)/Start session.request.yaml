$kind: http-request
url: "{{focus}}/sessions"
method: POST
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "topicId": "{{topicId}}",
      "plannedMinutes": 25,
      "allowedSites": [
        "https://www.google.com/search",
        "docs.oracle.com"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      const set = (k, v) => pm.collectionVariables.set(k, v);
      pm.test('status 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) {
        pm.test('active, sites cleaned to hosts', () => {
          pm.expect(j.status).to.eql('ACTIVE');
          pm.expect(j.allowedSites).to.eql(['docs.oracle.com', 'google.com']);
        });
        set('sessionId', j.id);
      }
    language: text/javascript
order: 2000
