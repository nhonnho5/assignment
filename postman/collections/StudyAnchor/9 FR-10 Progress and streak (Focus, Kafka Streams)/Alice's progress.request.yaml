$kind: http-request
url: "{{focus}}/progress/{{alice}}"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      // Wait for Kafka to deliver the event first.
      setTimeout(() => {}, 5000);
    language: text/javascript
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('today counts both ended sessions; 7 days; no streak yet', () => {
          pm.expect(j.today.seconds).to.be.at.least(3);
          pm.expect(j.today.focus).to.match(/^\d+m \d+s$/);
          pm.expect(j.last7Days).to.have.length(7);
          pm.expect(j.streakDays).to.eql(0);
        });
      }
    language: text/javascript
order: 1000
