$kind: http-request
url: "{{social}}/rooms/{{roomId}}/join"
method: POST
headers:
  X-User-Id: "{{bob}}"
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('2 members', () => pm.expect(j.members).to.have.length(2));
      }
    language: text/javascript
order: 12000
