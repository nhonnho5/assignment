$kind: http-request
url: "{{social}}/sharing"
method: PUT
headers:
  X-User-Id: "{{alice}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sharing": true
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('true', () => pm.expect(j.sharing).to.eql(true));
      }
    language: text/javascript
order: 10000
