$kind: http-request
url: "{{social}}/friends"
method: GET
headers:
  X-User-Id: "{{bob}}"
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('Alice is a friend', () => pm.expect(j.friends).to.eql([pm.collectionVariables.get('alice')]));
      }
    language: text/javascript
order: 8000
