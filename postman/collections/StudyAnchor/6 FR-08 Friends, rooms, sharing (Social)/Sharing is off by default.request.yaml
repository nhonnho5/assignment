$kind: http-request
url: "{{social}}/sharing"
method: GET
headers:
  X-User-Id: "{{alice}}"
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('status 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test('false (AC3)', () => pm.expect(j.sharing).to.eql(false));
      }
    language: text/javascript
order: 9000
